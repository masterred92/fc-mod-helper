[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fc-mod-helper"
version = "0.2.0"
description = "Patch-safety, backups and a youth academy tracker for EA SPORTS FC (PC) offline Career Mode modding."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "fc-mod-helper contributors" }]
keywords = ["ea-fc", "fc26", "fc27", "career-mode", "modding", "live-editor"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Environment :: Console",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "lupa>=2"]
app = ["tkinterdnd2>=0.4"]
build = ["pyinstaller>=6", "tkinterdnd2>=0.4"]

[project.scripts]
fcmh = "fcmh.cli:main"

[project.gui-scripts]
fc-mod-helper = "fcmh.app:main"

[project.urls]
Homepage = "https://github.com/masterred92/fc-mod-helper"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fcmh = ["data/*.json", "lua/*.lua", "assets/*.png", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
